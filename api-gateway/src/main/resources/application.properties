server.port=8080
spring.application.name=API-GATEWAY

spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**

spring.cloud.gateway.routes[1].id=job-service
spring.cloud.gateway.routes[1].uri=lb://JOB-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/jobs/**

spring.cloud.gateway.routes[2].id=application-service
spring.cloud.gateway.routes[2].uri=lb://APPLICATION-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/applications/**

spring.cloud.gateway.routes[3].id=recruitment-service
spring.cloud.gateway.routes[3].uri=lb://RECRUITMENT-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/recruitments/**

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

jwt.secret=TalentSyncSecretKeyForJWTSecurityAuthenticationSOA20262027VerySecureKey
